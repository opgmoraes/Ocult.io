<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Ocult.io</title>
    <link rel="icon" type="image/png" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="global-notification"></div>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo"><img src="images/logo.png" alt="Ocult.io Logo"></a>
            <h2>Recuperar sua Senha</h2>
            <p class="auth-subtext">Digite seu e-mail e enviaremos um link seguro para você criar uma nova senha.</p>
            <div id="notification"></div>
            <form id="recover-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit" class="btn-principal auth-btn">Enviar Link de Recuperação</button>
            </form>
            <p>Lembrou a senha? <a href="login.html">Faça Login</a></p>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
